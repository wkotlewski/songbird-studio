<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071C17" />
  <title>Songbird</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Songbird" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=add,add_circle,air,airwave,album,arrow_downward,arrow_forward,arrow_upward,auto_awesome,autorenew,balance,campaign,check,check_circle,chevron_left,chevron_right,close,close_small,compress,delete,download,edit,expand_less,expand_more,favorite,fiber_manual_record,file_open,fit_screen,graphic_eq,headphones,hearing,history,home,instant_mix,ios_share,layers,library_add,library_music,lightbulb,mic,more_horiz,music_note,noise_control_off,notifications,piano,play_arrow,public,record_voice_over,redo,refresh,remove,repeat,restart_alt,search,share,skip_next,skip_previous,sound_sampler,spa,spatial_audio,speaker,stop,swap_horiz,timeline,timer,trending_up,tune,undo,volume_down,volume_off,volume_up,wand_stars,zoom_in,zoom_out&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=20261113i" />
  <link rel="stylesheet" href="material.css?v=20261113i" />
</head>
<body data-screen="library">
  <div class="app">
    <aside id="library" class="pane">
      <header class="lib-head">
        <div>
          <p class="brand">Songbird</p>
          <h1>My Music</h1>
          <p class="hint library-lead">Hum, sing, or clap. Songbird turns it into a song.</p>
        </div>
        <button class="icon-btn" data-action="open-song-file" aria-label="Open a song file" title="Open a song file"><span class="ms" aria-hidden="true">file_open</span></button>
        <button class="icon-btn" data-action="new-song" aria-label="Create new song" title="Create new song"><span class="ms" aria-hidden="true">add</span></button>
      </header>
      <label class="search">
        <span class="ms" aria-hidden="true">search</span>
        <span class="sr">Search songs</span>
        <input id="search" type="search" placeholder="Search songs" aria-label="Search songs" />
      </label>
      <p id="library-note" class="hint library-note" role="status" hidden></p>
      <div id="song-list" class="song-list"></div>
      <nav class="mobile-nav">
        <button class="btn btn-primary" data-action="show-library">My Music</button>
        <button class="btn btn-secondary" data-action="new-song">Create New</button>
      </nav>
      <p class="legal">© 2026 Whitney Kotlewski. All rights reserved.</p>
    </aside>

    <main id="studio" class="pane">
      <header class="studio-bar">
        <button class="icon-btn mobile-only" data-action="show-library" aria-label="My Music" title="My Music"><span class="ms" aria-hidden="true">library_music</span></button>
        <div class="title-block">
          <div class="title-row">
            <input id="song-title" aria-label="Song title" autocomplete="off" autocorrect="off" value="Untitled song" />
            <label class="author-field">
              <span>Author</span>
              <input id="song-author" aria-label="Song author" placeholder="Name" />
            </label>
          </div>
          <p id="save-status">Songs stay on this device</p>
          <div id="project-actions" class="project-actions"></div>
        </div>
        <div class="transport">
          <button class="icon-btn" data-action="jump" data-jump="-1" aria-label="Back" title="Back"><span class="ms glyph" aria-hidden="true">skip_previous</span></button>
          <button class="icon-btn" data-action="play" id="play-btn" aria-label="Play" title="Play"><span class="ms glyph" aria-hidden="true">play_arrow</span></button>
          <button class="icon-btn" data-action="jump" data-jump="1" aria-label="Next" title="Next"><span class="ms glyph" aria-hidden="true">skip_next</span></button>
          <button class="icon-btn rec" data-action="record" id="rec-btn" aria-label="Record" title="Record"><span class="ms glyph" aria-hidden="true">fiber_manual_record</span></button>
          <button class="icon-btn" data-action="undo" aria-label="Undo" title="Undo"><span class="ms" aria-hidden="true">undo</span></button>
          <button class="icon-btn" data-action="redo" aria-label="Redo" title="Redo"><span class="ms" aria-hidden="true">redo</span></button>
        </div>
        <label class="bpm" title="Speed, in beats per minute">
          Speed
          <input id="bpm" type="number" min="40" max="200" value="92" aria-label="Speed in beats per minute" />
        </label>
        <button class="chip on" id="click-btn" data-action="toggle-click" aria-pressed="true" title="The beat sound that helps you keep time">Beat</button>
        <button class="chip on" id="loop-btn" data-action="toggle-looper" aria-pressed="true" title="Repeat: your sound plays over and over">Repeat</button>
      </header>

      <div id="section-bar" class="section-bar"></div>
      <div class="stage">
        <canvas id="sky" class="sky" aria-hidden="true"></canvas>
        <div id="timeline" class="timeline" tabindex="0" aria-label="Song timeline. Drag to move the play line. Click a section to jump there.">
          <div class="timeline-inner">
            <div class="ruler" id="ruler"></div>
            <div id="tracks"></div>
            <div id="playhead" class="playhead"></div>
          </div>
        </div>
      </div>

      <p class="legal">© 2026 Whitney Kotlewski. All rights reserved.</p>
      <section id="guide" class="guide" hidden aria-label="What to do next"></section>
      <div class="dock">
        <button class="dock-btn" data-action="panel" data-panel="record"><span class="nav-pill"><span class="ms" aria-hidden="true">mic</span></span><span class="plan-copy"><b>Record</b><span>Sing, hum, or clap</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="transform"><span class="nav-pill"><span class="ms" aria-hidden="true">wand_stars</span></span><span class="plan-copy"><b>Magic</b><span>Add instruments</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="mix"><span class="nav-pill"><span class="ms" aria-hidden="true">instant_mix</span></span><span class="plan-copy"><b>Mixer</b><span>Studio quality</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="build"><span class="nav-pill"><span class="ms" aria-hidden="true">timeline</span></span><span class="plan-copy"><b>Length</b><span>How long, how it builds</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="finish"><span class="nav-pill"><span class="ms" aria-hidden="true">download</span></span><span class="plan-copy"><b>Save</b><span>Keep your song</span></span></button>
      </div>
    </main>

    <aside id="inspector" class="pane" aria-live="polite">
      <div class="sheet-handle" data-action="close-panel" aria-label="Close panel"></div>
      <div id="inspector-body"></div>
    </aside>
  </div>
  <script src="music.js?v=20261113i"></script>
  <script src="packages.js?v=20261113i"></script>
  <script src="sampler.js?v=20261113i"></script>
  <script src="app.js?v=20261113i"></script>
  <script src="magic.js?v=20261113i"></script>
  <script src="sounds.js?v=20261113i"></script>
  <script src="notecheck.js?v=20261113i"></script>
  <script src="pads.js?v=20261113i"></script>
  <script src="songfile.js?v=20261113i"></script>
  <script src="arrange.js?v=20261113i"></script>
  <script src="retake.js?v=20261113i"></script>
  <script src="vocals.js?v=20261113i"></script>
  <script src="guide.js?v=20261113i"></script>
  <script src="material.js?v=20261113i"></script>
</body>
</html>

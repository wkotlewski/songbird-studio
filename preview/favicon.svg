<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17503f"/>
      <stop offset="1" stop-color="#071C17"/>
    </linearGradient>
    <linearGradient id="bird" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6ee7bb"/>
      <stop offset="1" stop-color="#2cc58f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g transform="translate(-2.5 2.5) scale(0.97)">
  <!-- the song -->
  <g fill="none" stroke="#F9A8D4" stroke-linecap="round" stroke-width="3.6">
    <path d="M51.5 15.5a8 8 0 0 1 2 9.5"/>
    <path d="M56.5 10.5a15 15 0 0 1 3 17.5" opacity="0.7"/>
  </g>
  <g fill="url(#bird)">
    <!-- tail, sweeping up like a note's flag -->
    <path d="M20 41 5.5 47.5c-1 .5-.8 2 .3 2.1L22 50z"/>
    <!-- body -->
    <ellipse cx="29" cy="40" rx="17" ry="13.5" transform="rotate(-24 29 40)"/>
    <!-- head -->
    <circle cx="40" cy="23.5" r="10"/>
  </g>
  <!-- wing -->
  <path fill="#0f5a41" d="M18 39.5c4.8-4.6 13.4-5.4 18.5-.8-4.4 5.6-13.4 6.6-18.5.8z"/>
  <!-- beak, open in song -->
  <path fill="#EC4899" d="M48.6 20.4 57.5 19c.8-.1 1.2 1 .5 1.4L49.6 25.5z"/>
  <path fill="#EC4899" d="M49.4 26.3 56 27.6c.7.1.7 1.1 0 1.3L48.6 30z"/>
  <!-- eye -->
  <circle cx="42.4" cy="21.6" r="2.6" fill="#071C17"/>
  <circle cx="43.2" cy="20.8" r="0.8" fill="#FFFBF2"/>
  </g>
</svg>

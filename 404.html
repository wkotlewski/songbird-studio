<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071C17" />
  <title>Songbird</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body data-screen="library">
  <div class="app">
    <aside id="library" class="pane">
      <header class="lib-head">
        <div>
          <p class="brand">Songbird</p>
          <h1>My Music</h1>
        </div>
        <button class="icon-btn" data-action="new-song" aria-label="Create new song" title="Create new song"><span aria-hidden="true">+</span></button>
      </header>
      <label class="search">
        <span class="sr">Search songs</span>
        <input id="search" type="search" placeholder="Search songs" aria-label="Search songs" />
      </label>
      <div id="song-list" class="song-list"></div>
      <nav class="mobile-nav">
        <button class="btn btn-primary" data-action="show-library">My Music</button>
        <button class="btn btn-secondary" data-action="new-song">Create New</button>
      </nav>
      <p class="legal">© 2026 Whitney Kotlewski. All rights reserved.</p>
    </aside>

    <main id="studio" class="pane">
      <header class="studio-bar">
        <button class="icon-btn mobile-only" data-action="show-library" aria-label="My Music" title="My Music"><span aria-hidden="true">⌂</span></button>
        <div class="title-block">
          <input id="song-title" aria-label="Song title" value="Untitled song" />
          <p id="save-status">Prototype · recordings stay in this tab</p>
          <div id="project-actions" class="project-actions"></div>
        </div>
        <div class="transport">
          <button class="icon-btn" data-action="play" id="play-btn" aria-label="Play" title="Play"><span class="glyph">▶</span></button>
          <button class="icon-btn rec" data-action="record" id="rec-btn" aria-label="Record" title="Record"><span class="glyph">●</span></button>
          <button class="icon-btn" data-action="undo" aria-label="Undo" title="Undo"><span aria-hidden="true">↶</span></button>
          <button class="icon-btn" data-action="redo" aria-label="Redo" title="Redo"><span aria-hidden="true">↷</span></button>
        </div>
        <label class="bpm">
          BPM
          <input id="bpm" type="number" min="40" max="200" value="92" aria-label="BPM" />
        </label>
        <button class="chip on" id="click-btn" data-action="toggle-click" aria-pressed="true" title="Metronome click">Click</button>
      </header>

      <p class="note">Open an example and press play. A transform keeps the original and adds a new layer made from it.</p>

      <div class="stage">
        <canvas id="sky" class="sky" aria-hidden="true"></canvas>
        <div id="timeline" class="timeline" tabindex="0" aria-label="Song timeline. Drag to move the play line. Click a section to jump there.">
          <div class="timeline-inner">
            <div class="ruler" id="ruler"></div>
            <div id="tracks"></div>
            <div id="playhead" class="playhead"></div>
          </div>
        </div>
      </div>

      <p class="legal">© 2026 Whitney Kotlewski. All rights reserved.</p>
      <div class="dock">
        <button class="dock-btn" data-action="panel" data-panel="record"><span class="plan-copy"><b>Record</b><span>Make a sound</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="transform"><span class="plan-copy"><b>Transform</b><span>Turn it into something new</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="build"><span class="plan-copy"><b>Build</b><span>Add more layers</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="mix"><span class="plan-copy"><b>Mix</b><span>Balance and enhance</span></span></button>
        <button class="dock-btn" data-action="panel" data-panel="finish"><span class="plan-copy"><b>Finish</b><span>Master and make video</span></span></button>
      </div>
    </main>

    <aside id="inspector" class="pane" aria-live="polite">
      <div class="sheet-handle" data-action="close-panel" aria-label="Close panel"></div>
      <div id="inspector-body"></div>
    </aside>
  </div>
  <script src="music.js"></script>
  <script src="app.js"></script>
</body>
</html>
